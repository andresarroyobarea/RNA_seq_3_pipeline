conda_envs: 
  qc: "envs/qc.yaml"
  umi_tools: "envs/umi_tools.yaml"
  preprocessing: "envs/preprocessing.yaml"
  fastq_screen: "envs/fastq_screen.yaml"
  aligners: "envs/aligners.yaml"
  qualimap: "envs/qualimap.yaml"
  rseqc: "envs/rseqc.yaml"
  quantification: "envs/quantification.yaml"

sample:
  - MEC1-MYC-OE-S1
  - MEC1-MYC-OE-S2
  - MEC1-MYC-OE-S3
  - MEC1-MYC-WT-S1
  - MEC1-MYC-WT-S2
  - MEC1-MYC-WT-S3
  - PGA-MYC-OE-COMBO
  - PGA-MYC-OE-S1
  - PGA-MYC-OE-S2
  - PGA-MYC-OE-S3
  - PGA-MYC-WT-S1
  - PGA-MYC-WT-S2
  - PGA-MYC-WT-S3

umi_processing: 
  enabled: True
  pattern: '^(?P<umi_1>.{6})(?P<discard_1>.{4}).*' 

seq_lane:
  - L008

fastq_screen:
  aligner: bowtie2

genome_index: resources/genome/hg38_genome_index
annotation: resources/annotations/hg38/Homo_sapiens.GRCh38.111.gtf
reference_bed: resources/annotations/hg38/Homo_sapiens.GRCh38.111.bed
fastq_screen_conf: resources/fastq_screen_files/FastQ_Screen_Genomes/fastq_screen.conf
fastq_screen_aling: bowtie2
adapters: "resources/trim_files/adapters.fa.gz"
polyA: "resources/trim_files/polyA.fa.gz"

qualimap:
  genome: HUMAN

resources:
  default:
    threads: 1
    mem_mb: 4096
    runtime: 10

  fastqc:
    threads: 2
    mem_mb: 4096
    runtime: 10

  bbduk:
    threads: 8
    mem_mb: 8192
    runtime: 60
  
  fastq_screen:
    threads: 8
    mem_mb: 10240
    runtime: 10
  
  alignment:
    threads: 8
    mem_mb: 64000
    runtime: 60
  
  bam_indexing:
    threads: 8
    mem_mb:  4096
    runtime: 10
  
  qualimap:
    threads: 8
    mem_mb:  16384
    runtime: 10
  
  rseqc_strand:
    threads: 4
    mem_mb:  8192
    runtime: 10
  
  feature_counts:
    threads: 8
    mem_mb:  64000
    runtime: 120
  
  umi_extract:
    threads: 8
    mem_mb: 8192
    walltime: 60

  umi_dedup:
    threads: 8
    mem_mb:  32000
    runtime: 120